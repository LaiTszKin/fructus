skip_local_validator = true

[toolchain]

[features]
resolution = true
skip-lint = false

[programs.localnet]
fructus = "3EsUd5XQ6KChedwL2ho8pv3zrrGGFvMpJEV1PnzN8MD1"

# Devnet deployment (R-D1a).
#
# The id below is the DEPLOYED devnet program id and equals `declare_id!` in
# programs/fructus/src/lib.rs and the SDK's `PROGRAM_ID` (Anchor derives every
# PerpMarket / OrderBook / Position PDA from the program id, so a mismatch
# breaks all PDA derivation). `scripts/deploy.sh` still refuses the old
# `J2xccRtuG43drESLYznHhLhQkLTdfepcKYbiQ9BsJVaf` placeholder id.
[programs.devnet]
fructus = "3EsUd5XQ6KChedwL2ho8pv3zrrGGFvMpJEV1PnzN8MD1"

[provider]
# Localnet is the ACTIVE DEFAULT profile and is left unchanged.
#
# Anchor reads a single `[provider]` table, so the devnet provider is selected
# per-command rather than as a second table: `--provider.cluster devnet
# --provider.wallet <path>`. `scripts/deploy.sh` passes both from env
# (DEVNET_CLUSTER, DEVNET_WALLET), keeping the localnet default intact.
cluster = "localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo nextest run"

[hooks]
