[workspace]
resolver = "2"
members = ["programs/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/LaiTszKin/fructus"

[workspace.dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
solana-program = "4.1.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
