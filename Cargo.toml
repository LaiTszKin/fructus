[workspace]
resolver = "2"
members = ["programs/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89.0"
license = "MIT"
repository = "https://github.com/LaiTszKin/fructus"

[workspace.dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"

# Local builds (dev + test) carry no debug info: DWARF is the bulk of what this
# dependency graph writes into `target/` and it dominates the link step of the
# test binaries. Backtraces keep their symbol names, they lose file/line info.
[profile.dev]
debug = false

# `debug = false` is already the release default — stated explicitly so neither
# the host release build nor the SBF `.so` (`anchor build` / `cargo-build-sbf`)
# ever picks up DWARF from this profile.
[profile.release]
debug = false
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
