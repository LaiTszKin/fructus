[package]
name = "fructus"
version = "0.1.0"
description = "Fructus — a Solana protocol for trading yield futures."
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository = "https://github.com/LaiTszKin/fructus"

[lib]
crate-type = ["cdylib", "lib"]
name = "fructus"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
bytemuck = { version = "1.17", features = ["derive", "min_const_generics"] }
solana-sdk-ids = "3.1.0"
solana-instructions-sysvar = "3.0.0"
sha2 = "0.11"

[dev-dependencies]
anchor-lang = { workspace = true }
proptest = "1"
solana-account = "=3.4.0"
solana-instruction = "=3.4.0"
solana-keypair = "=3.1.2"
solana-program-pack = "=3.1.0"
solana-program-test = { version = "3.1", features = ["agave-unstable-api"] }
solana-pubkey = "=3.0.0"
solana-rent = "=3.1.0"
solana-sdk-ids = "=3.1.0"
solana-signature = "=3.4.0"
solana-signer = "=3.0.0"
solana-transaction = "=3.1.0"
solana-transaction-error = "=3.4.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
spl-token = "9.0"
spl-associated-token-account = "8.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Two deliberate style exceptions, allowed so `cargo clippy -D warnings` can be
# a gate instead of a nag:
#
# - `field_reassign_with_default`: test fixtures build the zero-copy
#   `#[repr(C)]` structs (OrderBook / OutEvent, 10+ fields) field-by-field from
#   `Default::default()`. Struct-update syntax would hide which slots stay
#   zeroed, and "zeroed" is exactly what those tests assert about unwritten
#   slots.
# - `too_many_arguments`: the positional helpers mirror the on-chain handler and
#   adapter argument lists (`append_event`, `apply_open_fills`, the review
#   suite's `handler_transition`); grouping them into structs would break the
#   1:1 reading against `lib.rs` / the design doc.
[lints.clippy]
field_reassign_with_default = "allow"
too_many_arguments = "allow"
